name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  verify:
    name: Lint, build, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect package scripts
        id: scripts
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const { readFileSync } = require('node:fs')
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const scripts = pkg.scripts || {}
          for (const name of ['lint', 'build', 'test']) {
            console.log(`has_${name}=${Object.prototype.hasOwnProperty.call(scripts, name) ? 'true' : 'false'}`)
          }
          NODE

      - name: Run lint
        if: steps.scripts.outputs.has_lint == 'true'
        run: npm run lint

      - name: Run build
        if: steps.scripts.outputs.has_build == 'true'
        run: npm run build

      - name: Run tests
        if: steps.scripts.outputs.has_test == 'true'
        run: npm test

      - name: CI summary
        if: always()
        shell: bash
        run: |
          echo "## CI summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Install dependencies | completed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ steps.scripts.outputs.has_lint == 'true' && 'run' || 'skipped (no script)' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ steps.scripts.outputs.has_build == 'true' && 'run' || 'skipped (no script)' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test | ${{ steps.scripts.outputs.has_test == 'true' && 'run' || 'skipped (no script)' }} |" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ CI completed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ CI failed. Review the failed step logs above." >> "$GITHUB_STEP_SUMMARY"
          fi
